name: Сборка и публикация на GitHub Pages

on:
  push:
    branches:
      - arena/01a0fc95-svo-simulator
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Настройка Pages
        uses: actions/configure-pages@v5
        with:
          # токен воркфлоу имеет pages:write — включаем Pages сами,
          # без ручного переключателя в настройках репозитория
          enablement: true

      - name: Артефакт сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
