name: Сборка и публикация на GitHub Pages

on:
  push:
    branches:
      - arena/01a0fc95-svo-simulator
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Диагностика прав токена
        run: |
          echo "--- создание Pages-сайта ---"
          curl -s -o /tmp/o -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}'
          cat /tmp/o; echo
          echo "--- права установленного токена ---"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }} \
            | grep -o '"permissions":{[^}]*}'; echo

      - name: Настройка Pages
        uses: actions/configure-pages@v5
        with:
          # токен воркфлоу имеет pages:write — включаем Pages сами,
          # без ручного переключателя в настройках репозитория
          enablement: true

      - name: Артефакт сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
